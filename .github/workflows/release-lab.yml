name: release-lab

# 临时实验：确认 macOS(arm64) 上哪种打包方式能真正加载原生 WebP 库。
# 单文件自解压(single) vs 目录式发布(dir，原生库散落并由 ad-hoc 签名)。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mac:
    name: macos-${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [single, dir]
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 构建（${{ matrix.mode }}）
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "single" ]; then
            bash tools/build-cli.sh osx-arm64
            mkdir -p out && tar xzf .artifacts/release/*-osx-arm64.tar.gz -C out
          else
            dotnet publish Cli/SharpImageConverter.Cli.csproj -c Release -r osx-arm64 --self-contained true \
              -p:PublishSingleFile=false -p:DebugType=none -p:GenerateDocumentationFile=false -o out
          fi
          echo "--- 发布目录 ---"
          ls -la out | head -40
          echo "--- webp 相关 ---"
          find out | grep -i webp || true

      - name: 签名 + 实机冒烟
        shell: bash
        run: |
          set -euo pipefail
          find out -name '*.dylib' -print0 | xargs -0 -I{} codesign --force --sign - {} 2>&1 | tail -3 || true
          codesign --force --sign - out/SharpImageConverter.Cli
          cd out
          ./SharpImageConverter.Cli ../examples/car.png a.webp
          ./SharpImageConverter.Cli a.webp b.png
          ./SharpImageConverter.Cli ../examples/car.png c.jpg --quality 85
          ls -l a.webp b.png c.jpg
