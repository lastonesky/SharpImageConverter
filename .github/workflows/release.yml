name: release

# 推送 v* tag → 全自动：三平台构建 CLI 资产（各自实机冒烟）→ 打包 → 创建/更新 GitHub Release。
# 手动触发 → 只接受一个「已存在的 tag」，且只写 **草稿** Release（试跑/补发不会公开发布）。
#
# NuGet 包由 nuget-publish.yml 走 OIDC trusted publishing 推送，与本工作流互不依赖（同一次 tag、同一份源码）。
# 发布口径见 docs/Release.md。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v1.0.1）"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cli:
    name: CLI ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都在原生 runner 上构建：win/linux 的原生库按宿主 OS 选择即可正确，
        # osx-arm64 还必须用 install_name_tool 修 @rpath 并做 ad-hoc 签名（见 tools/build-cli.sh）。
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          # 用 macos-15（arm64）而不是 macos-latest：macos-26 的 arm64 池常排队超时被取消
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 构建 ${{ matrix.rid }}
        shell: bash
        run: bash tools/build-cli.sh ${{ matrix.rid }}

      - name: 冒烟测试（实机：PNG→WebP→PNG + JPEG）
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          work=.artifacts/smoke
          rm -rf "$work"; mkdir -p "$work"
          if [ "$RID" = "win-x64" ]; then
            bin=$(ls .artifacts/release/*-"$RID".exe)
          else
            tar xzf .artifacts/release/*-"$RID".tar.gz -C "$work"
            bin=$(find "$work" -type f -name 'SharpImageConverter.Cli' | head -1)
            chmod +x "$bin"
          fi
          [ -n "$bin" ] || { echo "::error::未找到可执行文件"; exit 1; }
          file "$bin"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS 走目录式发布：确认修好的 @rpath 依赖副本确实在二进制旁边
            d=$(dirname "$bin")
            ls "$d" | grep -q 'libwebp\.7\.dylib' || { echo "::error::缺少 libwebp.7.dylib"; exit 1; }
            ls "$d" | grep -q 'libsharpyuv\.0\.dylib' || { echo "::error::缺少 libsharpyuv.0.dylib"; exit 1; }
          fi

          "$bin" examples/car.png "$work/a.webp"          # 编码：走原生 libwebp
          "$bin" "$work/a.webp" "$work/b.png"             # 解码：走原生 libwebpdecoder
          "$bin" examples/car.png "$work/c.jpg" --quality 85
          for f in a.webp b.png c.jpg; do
            if [ ! -s "$work/$f" ]; then
              echo "::error::冒烟测试失败：$f 为空"
              exit 1
            fi
          done
          echo "冒烟测试通过："; ls -l "$work/a.webp" "$work/b.png" "$work/c.jpg"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: .artifacts/release/SharpImageConverter.Cli-*
          if-no-files-found: error

  release:
    name: 创建 / 更新 Release
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: .artifacts/release

      - name: 打包 NuGet（nupkg + snupkg）
        run: dotnet pack src/SharpImageConverter.csproj -c Release -o .artifacts/release

      - name: 生成 SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd .artifacts/release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" .artifacts/release/* --clobber --repo "$REPO"
          else
            # 手动触发一律先建草稿；tag 推送才直接公开发布
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release create "$TAG" .artifacts/release/* \
                --repo "$REPO" --title "$TAG" --verify-tag --generate-notes --draft
            else
              gh release create "$TAG" .artifacts/release/* \
                --repo "$REPO" --title "$TAG" --verify-tag --generate-notes
            fi
          fi
