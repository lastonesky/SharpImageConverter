name: release

# 推送 v* tag → 全自动：三平台构建 CLI 资产 → 打包 → 创建/更新 GitHub Release。
# 手动触发 → 只接受一个「已存在的 tag」，构建结果写入 **草稿** Release（试跑/补发用，不会公开发布）；
#          同时会额外尝试 macOS arm64 实机冒烟测试。
#
# NuGet 包由 nuget-publish.yml 走 OIDC trusted publishing 推送，与本工作流互不依赖（同一次 tag、同一份源码）。
# 发布口径见 docs/Release.md。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v1.0.1）"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cli:
    name: CLI ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # win / linux 在原生 runner 上构建并实机冒烟。
        # osx-arm64 用 Intel runner 交叉构建：GitHub 的 macOS arm64 runner 容量紧张，
        # 排队 15 分钟后会被直接取消（"job was not acquired by Runner"），无法作为发版的可靠前置。
        # 交叉构建产物由下面的 osx-arm64-native-smoke（手动触发时）做实机验证。
        include:
          - os: windows-latest
            rid: win-x64
            smoke: run
          - os: ubuntu-latest
            rid: linux-x64
            smoke: run
          - os: macos-15-intel
            rid: osx-arm64
            smoke: static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: 构建 ${{ matrix.rid }}
        shell: bash
        run: bash tools/build-cli.sh ${{ matrix.rid }}

      - name: 冒烟测试（实机：PNG→WebP→PNG + JPEG）
        if: matrix.smoke == 'run'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          work=.artifacts/smoke
          rm -rf "$work"; mkdir -p "$work"
          if [ "$RID" = "win-x64" ]; then
            bin=$(ls .artifacts/release/*-"$RID".exe)
          else
            tar xzf .artifacts/release/*-"$RID".tar.gz -C "$work"
            bin=$work/SharpImageConverter.Cli
          fi
          "$bin" examples/car.png "$work/a.webp"          # 编码：走原生 libwebp
          "$bin" "$work/a.webp" "$work/b.png"             # 解码：走原生 libwebpdecoder
          "$bin" examples/car.png "$work/c.jpg" --quality 85
          for f in a.webp b.png c.jpg; do
            if [ ! -s "$work/$f" ]; then
              echo "::error::冒烟测试失败：$f 为空"
              exit 1
            fi
          done
          echo "冒烟测试通过："; ls -l "$work"

      - name: 静态校验（交叉构建：架构与原生库）
        if: matrix.smoke == 'static'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          work=.artifacts/smoke
          rm -rf "$work"; mkdir -p "$work"
          tar xzf .artifacts/release/*-"$RID".tar.gz -C "$work"
          bin=$work/SharpImageConverter.Cli
          file "$bin"
          file "$bin" | grep -q 'arm64' || { echo "::error::产物不是 arm64：$(file "$bin")"; exit 1; }
          # 交叉构建无法实机运行，至少确认原生库确实是 arm64 且被打进了 tar
          echo "仓库内 osx-arm64 原生库架构："
          file src/runtimes/osx-arm64/native/*.dylib | sed 's/^.*native\///'
          file src/runtimes/osx-arm64/native/*.dylib | grep -q 'arm64' || { echo "::error::原生库不是 arm64"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: .artifacts/release/SharpImageConverter.Cli-*
          if-no-files-found: error

  # 可选的实机验证：只在手动触发时尝试（arm64 runner 排队失败也不影响发布）
  osx-arm64-native-smoke:
    name: osx-arm64 实机冒烟（可选）
    if: github.event_name == 'workflow_dispatch' && needs.cli.result == 'success'
    needs: cli
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-osx-arm64
          path: .artifacts/dl
      - name: 解包 + 实机冒烟
        shell: bash
        run: |
          set -euo pipefail
          work=.artifacts/smoke
          rm -rf "$work"; mkdir -p "$work"
          tar xzf .artifacts/dl/*-osx-arm64.tar.gz -C "$work"
          file "$work/SharpImageConverter.Cli"
          codesign --force --sign - "$work/SharpImageConverter.Cli"   # 未签名的 arm64 二进制会被系统杀掉
          cd "$work"
          ./SharpImageConverter.Cli ../../examples/car.png a.webp
          ./SharpImageConverter.Cli a.webp b.png
          ./SharpImageConverter.Cli ../../examples/car.png c.jpg --quality 85
          ls -l a.webp b.png c.jpg

  release:
    name: 创建 / 更新 Release
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: .artifacts/release

      - name: 打包 NuGet（nupkg + snupkg）
        run: dotnet pack src/SharpImageConverter.csproj -c Release -o .artifacts/release

      - name: 生成 SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd .artifacts/release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" .artifacts/release/* --clobber --repo "$REPO"
          else
            # 手动触发一律先建草稿；tag 推送才直接公开发布
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release create "$TAG" .artifacts/release/* \
                --repo "$REPO" --title "$TAG" --verify-tag --generate-notes --draft
            else
              gh release create "$TAG" .artifacts/release/* \
                --repo "$REPO" --title "$TAG" --verify-tag --generate-notes
            fi
          fi
